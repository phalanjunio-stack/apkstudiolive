<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Kivo Studio</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; user-select: none; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(130% 100% at 50% 8%, #1a1f4d, #070912 62%);
      font-family: "Plus Jakarta Sans", Inter, "Segoe UI", system-ui, Arial, sans-serif; color: #eaf1ff;
    }
    .ks-card { width: 340px; text-align: center; animation: ks-rise .6s cubic-bezier(.22, 1, .36, 1) both; }
    .ks-logo { width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(108, 86, 255, .55)); animation: ks-pulse 2.4s ease-in-out infinite; }
    .ks-name { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: .3px; }
    .ks-name span { color: #9a7bff; font-weight: 500; margin-left: 7px; }
    .ks-bar { margin-top: 26px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .10); overflow: hidden; }
    .ks-fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #3a7bff, #7c54ff); box-shadow: 0 0 14px rgba(108, 86, 255, .6); transition: width .25s ease; }
    .ks-row { display: flex; justify-content: space-between; align-items: center; margin-top: 11px; font-size: 12px; color: #8fa3c8; }
    .ks-pct { color: #cfe4ff; font-weight: 600; font-variant-numeric: tabular-nums; }
    @keyframes ks-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ks-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div class="ks-card">
    <img class="ks-logo" src="../src/public/img/kivo-icon.png" alt="Kivo" onerror="this.style.display='none'" />
    <div class="ks-name">Kivo<span>Studio</span></div>
    <div class="ks-bar"><div class="ks-fill" id="f"></div></div>
    <div class="ks-row"><span id="s">Iniciando o motor&hellip;</span><span class="ks-pct" id="p">0%</span></div>
  </div>
  <script>
    var f = document.getElementById('f'), p = document.getElementById('p'), s = document.getElementById('s'), v = 0;
    var steps = ['Iniciando o motor…', 'Carregando gráficos…', 'Conectando áudio…', 'Preparando câmeras…', 'Quase lá…'];
    setInterval(function () {
      var t = 95;
      if (v < t) { v += Math.max(.6, (t - v) * .12); f.style.width = v + '%'; p.textContent = Math.round(v) + '%'; s.textContent = steps[Math.min(steps.length - 1, Math.floor(v / 20))]; }
    }, 70);
  </script>
</body>
</html>
